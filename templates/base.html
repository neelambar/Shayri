<!doctype html>
<html lang="hi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}शायरी{% endblock %} · शायरी संग्रह</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Mukta:wght@400;600;700&family=Laila:wght@400;600&family=Tiro+Devanagari+Hindi&display=swap" rel="stylesheet">
<link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}?v=13">
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>✒️</text></svg>">
<script>
  try { var t = localStorage.getItem('shayri-theme'); if (t) document.documentElement.dataset.theme = t; } catch (e) {}
  try { if (localStorage.getItem('shayri-script') === 'en') document.documentElement.dataset.script = 'en'; } catch (e) {}
</script>
</head>
<body>
<header class="topbar">
  <div class="wrap topbar-inner">
    <a class="brand" href="{{ url_for('index') }}">शायरी <span>संग्रह</span></a>
    <form class="topsearch" action="{{ url_for('index') }}" role="search">
      <input type="search" name="q" value="{{ q or '' }}" placeholder="Search poems, poets, words…" aria-label="Search" id="topsearch">
    </form>
    <nav class="nav">
      <a href="{{ url_for('poets') }}">Poets</a>
      <a href="{{ url_for('tags') }}">Tags</a>
      <a href="{{ url_for('index', fav=1) }}" title="Favourites">★</a>
      <a href="{{ url_for('random_poem') }}" title="Random poem">🎲</a>
      <button type="button" class="script-toggle" title="हिंदी / English letters" aria-label="Switch between Hindi and English letters"><span class="hi">A</span><span class="en">अ</span></button>
      <button type="button" class="theme-toggle" title="Light / dark" aria-label="Toggle dark mode">◐</button>
      <a class="btn btn-primary" href="{{ url_for('add') }}">+ Add</a>
    </nav>
  </div>
</header>

<main class="wrap">
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="flash flash-{{ cat }}">{{ msg }}</div>{% endfor %}
  {% endwith %}
  {% block content %}{% endblock %}
</main>

{% block footer %}{% endblock %}
<script src="{{ url_for('static', filename='app.js') }}?v=2"></script>
</body>
</html>
